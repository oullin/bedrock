guard: web
passwords: users
username: email
email: email
lowercase_usernames: true
home: /home
prefix: ""
domain: ""
middleware:
  - web
auth_middleware: auth
views: true
limiters:
  login: login
  two-factor: two-factor
  verification: 6,1
features:
  - registration
  - reset-passwords
  - email-verification
  - update-profile-information
  - update-passwords
  - two-factor-authentication
options:
  two-factor-authentication:
    confirm: true
    confirmPassword: true
    window: 1
