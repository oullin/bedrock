<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <script>
      window.__SPARK_STATE__ = {{ .InitialState }};
      window.__SPARK_STATE_PATH__ = {{ printf "%q" .StatePath }};
      window.__SPARK_ASSET_BASE_URL__ = {{ printf "%q" .AssetBaseURL }};
      window.__SPARK_ROUTES__ = {{ .Routes }};
    </script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script type="module" src="{{ .AssetBaseURL }}app.js"></script>
    <link rel="stylesheet" href="{{ .AssetBaseURL }}app.css" />
  </head>
  <body>
    <div id="billing-app"></div>
  </body>
</html>
