name: Services

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  vet:
    name: Service Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/**/go.sum
            services/**/go.sum

      - name: Vet
        run: make go-service-vet

  coverage:
    name: Service Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/**/go.sum
            services/**/go.sum

      - name: Test with coverage
        run: make go-service-coverage

      - name: Verify service coverage reports
        run: |
          set -euo pipefail

          find storage/.cache/coverage/go/services -type f | sort

          if ! find storage/.cache/coverage/go/services -type f \( \
            -name 'coverage.out' -o \
            -name 'lcov.info' -o \
            -name 'coverage-summary.json' -o \
            -name '*.lcov' \
          \) | grep -q .; then
            broadcastclient "No recognizable service coverage reports found in storage/.cache/coverage/go/services" >&2
            exit 1
          fi

      - name: Upload service coverage to Codecov (attempt 1)
        id: codecov_1
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          directory: storage/.cache/coverage/go/services
          flags: services
          slug: oullin/bedrock
          use_oidc: true
          fail_ci_if_error: true
          version: v11.2.8

      - name: Upload service coverage to Codecov (attempt 2)
        if: steps.codecov_1.outcome == 'failure'
        id: codecov_2
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          directory: storage/.cache/coverage/go/services
          flags: services
          slug: oullin/bedrock
          use_oidc: true
          fail_ci_if_error: true
          version: v11.2.8

      - name: Upload service coverage to Codecov (attempt 3)
        if: steps.codecov_2.outcome == 'failure'
        uses: codecov/codecov-action@v6
        with:
          directory: storage/.cache/coverage/go/services
          flags: services
          slug: oullin/bedrock
          use_oidc: true
          fail_ci_if_error: true
          version: v11.2.8

  build:
    name: Service Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/**/go.sum
            services/**/go.sum

      - name: Build
        run: make go-service-build
