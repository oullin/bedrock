name: Go

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  vet:
    name: Go Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/**/go.sum
            services/**/go.sum

      - name: Vet
        run: make vet

  coverage:
    name: Go Coverage Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/**/go.sum
            services/**/go.sum

      - name: Test with coverage
        run: make go-coverage-shard GO_COVERAGE_SHARDS=8 GO_COVERAGE_SHARD=${{ matrix.shard }}

      - name: Verify Go coverage reports
        run: |
          set -euo pipefail

          find storage/.cache/coverage/go -type f | sort

          if ! find storage/.cache/coverage/go -type f \( \
            -name 'coverage.out' -o \
            -name 'lcov.info' -o \
            -name 'coverage-summary.json' -o \
            -name '*.lcov' \
          \) | grep -q .; then
            broadcastclient "No recognizable Go coverage reports found in storage/.cache/coverage/go" >&2
            exit 1
          fi

      - name: Upload Go coverage to Codecov (attempt 1)
        id: codecov_1
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          directory: storage/.cache/coverage/go
          flags: go,go-shard-${{ matrix.shard }}
          slug: oullin/bedrock
          use_oidc: true
          fail_ci_if_error: true
          version: v11.2.8

      - name: Upload Go coverage to Codecov (attempt 2)
        if: steps.codecov_1.outcome == 'failure'
        id: codecov_2
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          directory: storage/.cache/coverage/go
          flags: go,go-shard-${{ matrix.shard }}
          slug: oullin/bedrock
          use_oidc: true
          fail_ci_if_error: true
          version: v11.2.8

      - name: Upload Go coverage to Codecov (attempt 3)
        if: steps.codecov_2.outcome == 'failure'
        uses: codecov/codecov-action@v6
        with:
          directory: storage/.cache/coverage/go
          flags: go,go-shard-${{ matrix.shard }}
          slug: oullin/bedrock
          use_oidc: true
          fail_ci_if_error: true
          version: v11.2.8

  build:
    name: Go Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            packages/**/go.sum
            services/**/go.sum

      - name: Build
        run: make go-build
