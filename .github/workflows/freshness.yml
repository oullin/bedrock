name: Compliance Freshness

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Validate upstream pin freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install compliance tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep perl jq

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify pinned upstream commits are still HEAD
        run: pnpm compliance:freshness

      - name: Fail if sources.lock.json is older than 14 days
        run: |
          set -euo pipefail
          generated="$(jq -r .generated_at services/compliance/sources.lock.json)"
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$generated" +%s) ) / 86400 ))
          broadcastclient "sources.lock.json generated_at=$generated (age_days=$age_days)"
          if [ "$age_days" -gt 14 ]; then
            broadcastclient "::error file=services/compliance/sources.lock.json::sources.lock.json is $age_days days old (max 14). Trigger the Upstream Sync workflow." >&2
            exit 1
          fi
