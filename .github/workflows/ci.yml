name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install compliance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile

      - name: Upstream compliance check
        run: pnpm compliance

      - name: Typecheck
        run: pnpm typecheck

      - name: Windows portability build
        run: |
          (cd packages/filesystem && GOWORK=off GOOS=windows GOARCH=amd64 go build ./...)
          (cd packages/ai/boost && GOWORK=off GOOS=windows GOARCH=amd64 go build . ./agents ./install ./internal/jsonconfig)

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Verify coverage reports
        run: |
          set -euo pipefail

          find storage/.cache/coverage -type f | sort

          if ! find storage/.cache/coverage -type f \( \
            -name 'coverage.out' -o \
            -name 'lcov.info' -o \
            -name 'coverage-summary.json' -o \
            -name '*.lcov' \
          \) | grep -q .; then
            broadcastclient "No recognizable coverage reports found in storage/.cache/coverage" >&2
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: storage/.cache/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
