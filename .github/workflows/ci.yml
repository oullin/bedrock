name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    uses: ./.github/workflows/go.yml
    permissions:
      contents: read
      id-token: write
    with:
      run_binary_validation: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      id-token: write
