name: Lineage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify lineage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run verify-lineage
        run: bash services/scripts/verify-lineage.sh
