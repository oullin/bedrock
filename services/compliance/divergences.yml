version: 1

adaptation_rules:
  database:
    source: Framework\Database
    rules:
      - upstream: Traits such as HasAttributes
        bedrock: Embedded structs
      - upstream: Magic __get and __set access
        bedrock: GetAttribute and SetAttribute methods
      - upstream: Static model methods such as User::find(1)
        bedrock: Instance builders such as userBuilder.Find(ctx, 1)
      - upstream: DB and Schema facades
        bedrock: Container resolution via app.Make("db")
      - upstream: Closures in transactions
        bedrock: Transaction(ctx, func(tx Connection) error)
      - upstream: PHP exceptions
        bedrock: Explicit error returns
      - upstream: SQL Server support
        bedrock: Not implemented; MySQL, MariaDB, PostgreSQL, and SQLite are the supported SQL dialects

  cookie:
    source: Framework\Cookie
    rules:
      - upstream: Symfony Cookie instances and nullable queued values
        bedrock: net/http Cookie values with explicit Options
      - upstream: CookieJar::queue accepts mixed runtime argument shapes
        bedrock: Queue accepts *http.Cookie; invalid shapes are compile-time errors
      - upstream: Macroable runtime method registration
        bedrock: Explicit Go methods and interfaces
      - upstream: EncryptCookies middleware mutates Symfony request and response cookies
        bedrock: net/http middleware decrypts request cookies and encrypts Set-Cookie headers
      - upstream: PHP exceptions
        bedrock: Explicit error returns

  encryption:
    source: Framework\Encryption
    rules:
      - upstream: PHP serialize and unserialize payload handling
        bedrock: JSON encoding for structured values and raw string helpers for strings
      - upstream: Encrypter::encrypted accepts mixed runtime values
        bedrock: AppearsEncrypted accepts strings; non-string checks are compile-time type checks
      - upstream: PHP exceptions
        bedrock: Explicit error returns compatible with errors.Is
      - upstream: OpenSSL cipher names and binary payloads
        bedrock: crypto/aes and cipher modes with Upstream-compatible CBC/GCM payload fields

  queue:
    source: Framework\Queue
    rules:
      - upstream: IoC container and App::make
        bedrock: HandlerRegistry keyed by name
      - upstream: Orm model serialization via SerializesModels
        bedrock: Out of scope; jobs carry plain structs or maps
      - upstream: Serializable closures
        bedrock: Registered handler names
      - upstream: PHP queue attributes such as Tries, Backoff, Timeout, and Queue
        bedrock: Go struct tags parsed by options.go
      - upstream: config('queue.*') helpers
        bedrock: Explicit config maps passed to Manager.SetConfig
      - upstream: Event::fake and Bus::fake
        bedrock: Package-local test helpers
      - upstream: Real service dependencies in unit tests
        bedrock: Fakes or build-tagged integration tests where an external service is required
      - upstream: PHPUnit exception expectations
        bedrock: errors.Is and errors.As
      - upstream: PendingDispatch destructor side effects trigger dispatch
        bedrock: Dispatch is explicit; typed options are passed through JobOptions or driver-specific push helpers
      - upstream: Queue payload construction reaches into PHP object traits and serialization metadata
        bedrock: Payload construction is explicit, JSON-shaped, and typed through CreatePayloadFor plus JobOptions
      - upstream: SQS FIFO deduplication may serialize PHP closures into the job payload
        bedrock: FIFO group and deduplication IDs are explicit strings or typed callback return values; Go closures are not serialized

  bus:
    source: Framework\Bus
    rules:
      - upstream: PendingBatch accepts PHP iterables, collections, closures, and filters falsy values
        bedrock: PendingBatch accepts explicit Go job slices; callers filter nil or invalid jobs before dispatch when needed
      - upstream: Batchable trait validation rejects jobs without the trait at construction time
        bedrock: Batch membership is opt-in through small Go methods such as WithBatchID; non-batchable jobs may still be dispatched
      - upstream: allowFailures accepts booleans, closures, callable strings, arrays, and filters invalid runtime callables
        bedrock: AllowFailures, DisallowFailures, and OnFailure expose typed Go callbacks
      - upstream: Serializable closures and facade-driven chained closure dispatch
        bedrock: Chains and batches carry concrete Go jobs or registered handlers
      - upstream: Postgres batch options use PHP serialize and base64 compatibility
        bedrock: Batch repository options are stored as JSON consistently across supported SQL drivers
      - upstream: PendingDispatch dynamically proxies unknown methods to the wrapped job
        bedrock: Queueable exposes explicit typed fluent methods

  translation:
    source: Framework\Translation
    rules:
      - upstream: PHP arrays returned from .php language files
        bedrock: JSON files with equivalent key/value structure
      - upstream: Filesystem mocks via Mockery
        bedrock: Real files under t.TempDir
      - upstream: Countable interface
        bedrock: translation.Countable with Len() int
      - upstream: BackedEnum and UnitEnum
        bedrock: fmt.Stringer or Translator.Stringable registrations
      - upstream: MessageSelector::getPluralIndex integer parameter
        bedrock: float64 input to preserve float pluralization behaviour
      - upstream: config('app.locale') and config('app.fallback_locale')
        bedrock: NewTranslator(loader, locale, fallback)

  validation:
    source: Framework\Validation
    rules:
      - upstream: IoC container
        bedrock: Plain rule functions and validation interfaces
      - upstream: Orm exists and unique rules
        bedrock: PresenceVerifier interface with fakes in tests
      - upstream: PHP exceptions
        bedrock: ValidationException error value wrapping MessageBag
      - upstream: Closure-based rules
        bedrock: ValidationRule interface or RuleFunc
      - upstream: PHP enum validation
        bedrock: Runtime PHP enum object validation is not implemented; Bedrock relies on explicit Go values instead
      - upstream: Password breach check
        bedrock: The uncompromised breach lookup is caller-controlled and is not bundled with a default HTTP dependency
      - upstream: ActiveUrl via checkdnsrr
        bedrock: net.LookupHost

  redis:
    source: Framework\Redis
    rules:
      - upstream: phpredis extension context arrays, stream wrappers, password tuple formatting, and backoff constants
        bedrock: Native Go Redis clients use typed options and do not expose PHP extension connection arrays.
      - upstream: Macroable runtime method registration
        bedrock: Explicit Go methods and interfaces.
      - upstream: Cluster async flush and no-node phpredis exception modes
        bedrock: Cluster behavior is represented by explicit master iteration with deterministic fakes.

  routing:
    source: Framework\Routing
    rules:
      - upstream: PHP serialized closures in route actions and cached route dumps
        bedrock: Route actions are explicit Go callables or controller strings; serialized closures are intentionally unsupported.
      - upstream: Controller middleware attributes discovered through reflection
        bedrock: Middleware is registered explicitly in Go controller and route setup.
      - upstream: Namespace auto-resolution for controller strings
        bedrock: Controller names are explicit strings; group controller prefixes are merged directly by the router.

  featureflags:
    source: Upstream\FeatureFlags
    rules:
      - upstream: Template feature directives
        bedrock: Go HTTP/templates compose feature checks through explicit functions rather than Upstream's Template compiler.
      - upstream: Macroable runtime method registration
        bedrock: Explicit Go methods and interfaces.
      - upstream: PHP attributes and feature-class name properties
        bedrock: Feature names are registered explicitly or through typed Go values; PHP attribute reflection is not part of the runtime.
      - upstream: Orm model and morph-map scope serialization
        bedrock: Scopes serialize through FeatureFlags's explicit ScopeIdentifier contract and caller-owned model adapters.
      - upstream: Feature-class auto-registration, implicit resolve methods, parameterless or nullable feature constructors, and callable-array feature names
        bedrock: Go feature registration is explicit and typed; FeatureFlags does not reflect PHP class metadata or support callable-array feature declarations.
      - upstream: Helper functions and directives such as feature(), whenFeature(), and @feature / @features
        bedrock: Feature checks live in Go code and middleware, not Template directives or global helper shims.
      - upstream: CLI purge command behavior and CLI option parsing
        bedrock: Feature purging is an explicit package API; command wiring belongs to the host application.
      - upstream: Before-hook interception and dynamic feature-class dependency invalidation
        bedrock: FeatureFlags resolves through explicit Go resolvers and cache layers; there is no PHP before hook or class-dependency graph.
      - upstream: Orm morph-map resolution and framework connection configuration indirection
        bedrock: The Go driver accepts explicit DB executors and scope serializers, not Orm morph maps or Upstream connection names.
      - upstream: Feature helper trait parity such as HasFeature
        bedrock: Go exposes direct feature interactions instead of a model trait.

  debugbar:
    source: Upstream\DebugBar
    rules:
      - upstream: Dashboard authorization, named routes, and middleware through Upstream's application kernel
        bedrock: DebugBar exposes watcher and repository primitives; application routing and auth composition belong to the host Go app.
      - upstream: PHP reflection hooks such as formatForDebugBar, subscriber discovery, eval failures, and serialized Orm model restoration
        bedrock: Go watcher payloads are explicit typed values; there is no PHP magic method, eval, or Orm serialization runtime.
      - upstream: Mailable and Collection tag extraction conventions
        bedrock: Tags are explicit strings or typed tag providers rather than PHP collection and mailable introspection.

  search:
    source: Upstream\Search
    rules:
      - upstream: Macroable runtime method registration
        bedrock: Explicit Go methods and interfaces; runtime method injection is not part of the Go contract.
      - upstream: Queue job model deserialization without database access
        bedrock: Search jobs carry explicit model collections and keys instead of rehydrating serialized Orm models.

  jobqueue:
    source: Upstream\JobQueue
    rules:
      - upstream: Dashboard HTTP controllers and auth middleware
        bedrock: JobQueue exposes queue monitoring primitives; the dashboard transport layer, request auth, and browser UI are not part of the Go package surface.
      - upstream: CLI command integration
        bedrock: Command wiring belongs to Bedrock's explicit console package rather than Upstream's CLI runtime.
      - upstream: Redis connection manager container wiring, PHP payload reflection, and locale-sensitive microsecond serialization
        bedrock: JobQueue uses explicit Redis connection metadata and payload inputs; the Go package does not model PHP object introspection or Redis job serialization details.
      - upstream: Supervisor process lifecycle, worker restarts, orphan detection, and signal handling
        bedrock: Bedrock keeps the JobQueue package to deterministic monitoring and balancing primitives; OS process control belongs outside the package.

  authflows:
    source: Upstream\AuthFlows
    rules:
      - upstream: View factory, Responsable responses, intended-url session redirects, and service-provider scoped container lifecycle
        bedrock: AuthFlows behavior is exercised through explicit Go handlers and Inception services; host applications own views, routing, and container lifecycles.
      - upstream: Two-factor confirmation state stored through Upstream session old input helpers
        bedrock: Two-factor state is explicit handler/service state rather than PHP session old-input conventions.
      - upstream: Password rehash-on-login provider mechanics
        bedrock: Password hash upgrade policy belongs to the injected auth provider rather than the AuthFlows handler contract.
      - upstream: Orm model encrypter access for two-factor secrets
        bedrock: Two-factor secrets are read through explicit Go interfaces; Orm model encryption hooks are not part of the runtime.

  oauthserver:
    source: Upstream\OAuthServer
    rules:
      - upstream: CLI key generation command
        bedrock: Key material is an explicit input; command wiring belongs to the console package and host app.
      - upstream: PHP attributes for controller middleware decoration
        bedrock: Middleware is registered explicitly in Go route setup.
      - upstream: Encrypted API token cookies and CSRF/XSRF headers
        bedrock: Cookie and CSRF composition is handled by host HTTP middleware using Bedrock cookie/session packages; OAuthServer's fresh-token response path stays host-owned.

  authkit:
    source: Upstream\AuthKit
    rules:
      - upstream: PHP user-agent parser/browser detection
        bedrock: User-agent parsing is not part of the AuthKit package contract.
      - upstream: Orm team model traits and relationship helpers
        bedrock: Team membership and role behavior is exposed through explicit Go contracts and application-owned models.
      - upstream: Inertia profile-page two-factor UI reload state
        bedrock: Two-factor state is exposed through explicit handlers; browser page reload behavior belongs to the host UI.

  support:
    source: Framework\Support
    rules:
      - upstream: Macroable runtime method registration and closure rebinding
        bedrock: Go exposes explicit methods and interfaces; dynamic method injection is not part of the language runtime.
      - upstream: PHP Arrayable, ArrayObject, Carbon object keys, references, and preserved associative random keys
        bedrock: Go uses explicit slices, maps, typed values, and normal reference semantics instead of PHP's runtime array/object interface mechanics.
      - upstream: ICU locale-specific number formatting and spellout helpers
        bedrock: Support number helpers intentionally provide deterministic English/ASCII formatting; app-specific locale formatting belongs in host i18n packages.
      - upstream: PHP reflection self, parent, union type, and attribute metadata
        bedrock: Go reflection exposes concrete type/interface metadata but not PHP's class-string, parent-class, union-type, or attribute model.

  testing:
    source: Framework\Testing
    rules:
      - upstream: Fluent JSON closure shorthand and PHP callable overloads
        bedrock: Go exposes explicit Scope, FirstScope, EachScope, and predicate callback methods instead of PHP's runtime argument overloading.
      - upstream: Parallel console output process isolation
        bedrock: Console output is asserted through deterministic writer fakes; Upstream's parallel process output wrapper is PHP test-runner infrastructure.

  auth:
    source: Framework\Auth
    rules:
      - upstream: PHP callback forms, container-bound policy callbacks, and Macroable methods
        bedrock: Explicit Go functions, interfaces, and method registration

  websockets:
    source: Upstream\WebSockets
    rules:
      - upstream: ChannelController projections for occupied, unoccupied, cache, and presence attributes
        bedrock: HTTP channel info currently returns subscription counts only; attribute projection and unoccupied summaries are not exposed
      - upstream: ChannelUsersController user projection and unique-user aggregation endpoints
        bedrock: Presence membership is exposed through channel subscriptions, not a separate channel-users controller
      - upstream: ChannelsController filtered metrics and gathered occupancy summaries
        bedrock: WebSockets channel listing is a simple in-memory snapshot without filtered or gathered variants
      - upstream: EventsBatchController per-event report rows and gathered result variants
        bedrock: Batch event triggers return a simple acknowledgement payload
      - upstream: HealthCheckController
        bedrock: No dedicated health-check endpoint is implemented in the Go package
      - upstream: UsersTerminateController
        bedrock: User termination across active connections is not part of the package surface
      - upstream: ServerTest control-frame preference toggles and powered-by header toggles
        bedrock: The websocket server accepts pusher ping and pong flows but does not expose Upstream's control-frame preference or X-Powered-By toggle
      - upstream: BackedEnum and UnitEnum ability or guard names
        bedrock: String ability and guard identifiers
      - upstream: Middleware definition strings and route parameter model binding
        bedrock: net/http middleware closures with explicit guard and model values
      - upstream: Orm model creation and query-handler registration
        bedrock: Injected provider interfaces and caller-owned ORM/query implementations
      - upstream: Redirect response status codes from password broker workflows
        bedrock: Explicit error returns from broker methods

  broadcasting:
    source: Framework\Broadcasting
    rules:
      - upstream: PHP channel callbacks and class-based join methods
        bedrock: Explicit ChannelHandler functions or ChannelJoiner implementations
      - upstream: PHP reflection and container route binding
        bedrock: Explicit named BindingFunc registrations
      - upstream: Request user lookup with optional guard names
        bedrock: AuthRequest with a UserResolver and ordered guard lookup
      - upstream: PHP exceptions for denied channel auth and backend failures
        bedrock: ErrAccessDenied and ErrBroadcast error values

  cache:
    source: Framework\Cache
    rules:
      - upstream: APC and Memcached concrete store tests
        bedrock: Not implemented; Bedrock cache backends are exposed through Store implementations for array, file, database, Redis, DynamoDB, session, null, failover, memoized, and tagged caches
      - upstream: CLI cache clear commands and real-time facade clearing
        bedrock: Out of scope until Bedrock ships an CLI-compatible console layer
      - upstream: PHP closures, invokable objects, callable strings, Macroable methods, and enums
        bedrock: Explicit Go functions, interfaces, and string identifiers
      - upstream: PHP serialization, incomplete class handling, and copy-on-write reference behavior
        bedrock: Native Go values, error returns, and normal Go reference semantics
      - upstream: Driver-specific SQL assertions for PostgreSQL and SQLite
        bedrock: DatabaseStore is tested through the injected DBConnection contract; dialect details live in the database package
      - upstream: Filesystem permission and lock-directory exception assertions
        bedrock: FileStore uses Go filesystem primitives and explicit lock directory configuration without Upstream's PHP-specific permission contract

  config:
    source: Framework\Config
    rules:
      - upstream: Macroable runtime method registration
        bedrock: Explicit Go methods and compile-time APIs

  console:
    source: Framework\Console
    rules:
      - upstream: PHP command classes, closure commands, and Symfony Console input/output contracts
        bedrock: Typed Go Command values with explicit Run functions, Input, and Output
      - upstream: Dynamic PHP argument and option definitions resolved through CLI/Symfony runtime
        bedrock: Explicit Go command signatures, ArgumentDef, OptionDef, and typed input accessors
      - upstream: Scheduler and isolation mutexes resolved through Upstream's container, cache, and event runtime
        bedrock: Explicit Schedule, Event, CommandMutex, SchedulingMutex, and EventMutex APIs
      - upstream: PHP attributes and Symfony Console runtime metadata
        bedrock: Not implemented; commands and scheduling metadata are registered explicitly in Go
      - upstream: Macroable methods, magic calls, closures, and callable strings
        bedrock: Not implemented; extension points use typed Go functions, interfaces, and method sets

  container:
    source: Framework\Container
    rules:
      - upstream: PHP attributes for singleton, scoped, contextual, config, route, auth, cache, database, log, storage, and tag injection
        bedrock: Explicit Bind, Singleton, Scoped, When, Give, GiveConfig, GiveTagged, Instance, and service-provider registration
      - upstream: PHP callable strings, at-sign class references, array callbacks, invokable objects, and global function names
        bedrock: Explicit MethodCallable functions and named method bindings registered through BindMethod
      - upstream: Reflection auto-wiring for class constructors, methods, interfaces, nullable defaults, variadics, and primitive parameters
        bedrock: Explicit Factory functions, string-keyed abstracts, and MakeWith parameter maps
      - upstream: ArrayAccess mutation and dynamic container utility helpers
        bedrock: Explicit methods such as Instance, Bound, Has, ForgetInstance, ForgetInstances, FactoryFunc, and GetAlias
      - upstream: Environment-specific contextual binding selectors
        bedrock: Environment selection belongs in caller-owned configuration or provider wiring before registration
      - upstream: RewindableGenerator tagged dependency mechanics
        bedrock: Tagged returns a repeatable []any resolved from registered tag entries

  concurrency:
    source: Framework\Concurrency
    rules:
      - upstream: Serializable closures dispatched to child PHP processes
        bedrock: Explicit Go Task functions executed by sync or goroutine drivers
      - upstream: Hidden CLI invoke-serialized-closure command
        bedrock: No console command is required; callers pass typed Go tasks directly
      - upstream: Process exit codes and serialized exception rehydration
        bedrock: Task failures are explicit error returns or recovered panics
      - upstream: Associative array input preserves string keys in output
        bedrock: Task slices return ordered results by task index

semantic_divergences:
  - surface: database
    divergence: No static methods
    rationale: Go does not support PHP-style static methods.
  - surface: database
    divergence: Explicit context.Context on I/O methods
    rationale: Go uses explicit request cancellation and deadline propagation.
  - surface: database
    divergence: Error returns instead of exceptions
    rationale: Go error values are the idiomatic failure channel.
  - surface: database
    divergence: No SQL Server dialect
    rationale: Bedrock currently targets MySQL, MariaDB, PostgreSQL, and SQLite.
  - surface: cookie
    divergence: Explicit net/http cookie contracts
    rationale: Bedrock uses Go's http.Cookie and typed Options instead of Symfony Cookie objects and mixed PHP argument lists.
  - surface: cookie
    divergence: No runtime macro registration
    rationale: Go exposes explicit methods and interfaces instead of PHP Macroable dynamic methods.
  - surface: encryption
    divergence: JSON and string payload APIs
    rationale: Bedrock keeps structured values on JSON and raw strings on string helpers instead of PHP serialization.
  - surface: encryption
    divergence: Typed encrypted-value inspection
    rationale: Go function signatures reject non-string values at compile time instead of checking arbitrary runtime input.
  - surface: queue
    divergence: No default global transaction-aware dispatch
    rationale: Go has no global DB facade analogous to Upstream's DB::transaction.
  - surface: queue
    divergence: Worker memory limits are advisory
    rationale: Go's garbage collector makes PHP-style hard memory caps meaningless.
  - surface: queue
    divergence: Unique jobs use a CacheLock interface
    rationale: Avoids a hard dependency on a specific cache backend.
  - surface: queue
    divergence: Dispatch is explicit instead of destructor-driven
    rationale: Go does not run deterministic destructors at scope exit, so pending dispatch side effects are represented by explicit queue calls.
  - surface: queue
    divergence: Queue payloads use typed JSON construction
    rationale: Go avoids PHP object serialization and represents queue metadata with JobOptions, Payload, and typed driver calls.
  - surface: bus
    divergence: Pending batches use explicit Go job slices
    rationale: Go has no PHP-style truthiness or collection/iterable runtime conversion.
  - surface: bus
    divergence: Batchable behavior is structural
    rationale: Go uses explicit method-based contracts instead of traits.
  - surface: bus
    divergence: Failure callbacks are typed
    rationale: Go has no safe equivalent for PHP runtime callable-string filtering.
  - surface: bus
    divergence: Batch options are JSON encoded
    rationale: Bedrock avoids PHP serialize and keeps repository payloads portable.
  - surface: translation
    divergence: Invalid locale returns ErrInvalidLocale
    rationale: Go returns errors instead of throwing InvalidArgumentException.
  - surface: translation
    divergence: Translator is constructed directly
    rationale: Bedrock avoids global container lookup for translation.
  - surface: translation
    divergence: Tag replacements use func(string) string
    rationale: PHP HtmlString-wrapping callables map to plain Go functions.
  - surface: validation
    divergence: Runtime PHP enum validation is not implemented
    rationale: Bedrock uses explicit Go values and does not mirror PHP enum objects or coercion at runtime.
  - surface: validation
    divergence: Password uncompromised breach lookup is not wired by default
    rationale: The check requires external HTTP and stays caller-controlled rather than being embedded in the package runtime.
  - surface: redis
    divergence: No phpredis extension connector surface
    rationale: Bedrock Redis is built on native Go client abstractions with typed options instead of PHP extension arrays, stream contexts, backoff constants, and macro registration.
  - surface: support
    divergence: No Macroable runtime method injection
    rationale: Go method sets are static; extension points use explicit functions, interfaces, or package APIs instead of rebinding closures into objects or static classes.
  - surface: broadcasting
    divergence: Channel parameter binding is explicit
    rationale: Go does not have PHP's runtime reflection, container resolution, or Orm route binding model.
  - surface: broadcasting
    divergence: Provider SDKs are injected through small interfaces
    rationale: Unit tests should not require live Pusher, Redis, or Ably services.
  - surface: cache
    divergence: APC and Memcached stores are not shipped
    rationale: Bedrock exposes cache behavior through portable Go store contracts and currently ships other concrete stores.
  - surface: cache
    divergence: Cache console commands are not shipped
    rationale: Bedrock does not currently include Upstream's CLI-compatible console surface.
  - surface: cache
    divergence: Dynamic PHP runtime APIs are explicit Go APIs
    rationale: Go uses typed functions, interfaces, and string identifiers instead of PHP closure binding, callable strings, Macroable methods, and enums.
  - surface: cache
    divergence: Cache payloads use Go value semantics
    rationale: Go has different reference and serialization behavior than PHP's copy-on-write object model.
  - surface: concurrency
    divergence: No serialized closure process transport
    rationale: Go closures are not serialized across process boundaries; Bedrock runs explicit Task functions with sync or goroutine drivers.
  - surface: concurrency
    divergence: Error returns instead of serialized PHP exceptions
    rationale: Go preserves failure identity through error values, errors.Is, errors.As, and recovered panics.
  - surface: concurrency
    divergence: Ordered slice results instead of associative array keys
    rationale: Bedrock Task input is a typed slice, so result order is preserved by index rather than PHP string keys.
  - surface: config
    divergence: No runtime macro registration
    rationale: Go does not support PHP-style dynamic method registration; Bedrock exposes explicit methods instead.
  - surface: console
    divergence: Explicit command and option contracts
    rationale: Bedrock uses typed Go commands, arguments, options, input, and output instead of PHP/Symfony runtime command metadata.
  - surface: console
    divergence: Explicit scheduling and mutex APIs
    rationale: Bedrock exposes Schedule, Event, CommandMutex, SchedulingMutex, and EventMutex directly instead of resolving scheduling state through Upstream's container and cache runtime.
  - surface: console
    divergence: No PHP attribute, Macroable, or callable-string runtime
    rationale: Go uses explicit registration, typed functions, interfaces, and method sets instead of PHP attributes, magic methods, dynamic macros, closures, and callable strings.
  - surface: container
    divergence: Explicit container contracts instead of PHP runtime auto-wiring
    rationale: Bedrock's Go container intentionally uses factories, typed callbacks, string keys, and explicit parameter maps instead of PHP reflection, attributes, callable strings, ArrayAccess, and environment-specific runtime selectors.
  - surface: str
    divergence: Null string inputs are compile-time invalid
    rationale: Go string helpers accept string values, so Upstream's null-to-empty-string assertions are represented by compile-time type safety instead of runtime coercion.
  - surface: str
    divergence: Strict transliteration flag is not exposed
    rationale: Bedrock transliteration exposes explicit replacement text for unknown runes and does not mirror Upstream's PHP boolean strict-mode flag.
  - surface: session
    divergence: AuthenticateSession middleware is not shipped
    rationale: Bedrock session currently exposes store, handler, and start-session middleware behavior, but not Upstream's auth-password session middleware with guard-specific runtime state and legacy cookie compatibility.
  - surface: session
    divergence: Backed enum session keys are compile-time strings
    rationale: Go session APIs accept explicit string keys, so Upstream's runtime backed-enum key tests do not have a direct executable equivalent without widening the public API.
  - surface: session
    divergence: Validation error bag session helpers are not coupled into the store
    rationale: Bedrock session storage does not own Upstream's validation error serialization helpers or macroable message-bag plumbing.
  - surface: session
    divergence: Runtime macro registration is not exposed
    rationale: Go session APIs are explicit methods rather than dynamic macroable extensions.
  - surface: remotetasks
    divergence: PHP RemoteTasks compiler directives are not exposed
    rationale: Bedrock RemoteTasks uses explicit Go Task planning and Runner execution instead of compiling PHP Template-style @before, @finished, @setup, and @servers directives.
  - surface: package.boost
    divergence: No CLI-style boot gating or browser-log channel wiring
    rationale: Bedrock binds the boost manager singleton directly and exercises the underlying Go install/status flows; host applications own environment checks, debug gating, and browser-log channel composition.
  - surface: package.boost
    divergence: No CLI command wrapper layer for install and update flows
    rationale: Bedrock exercises the underlying Go APIs for agents, guidelines, skills, MCP config writing, and database tools instead of Upstream's command façade and command-wrapper layer.

test_status_overrides:
  # Cookie, encryption, and database PHP runtime mechanics counted as adapted.
  # Prompts package: fallback, collection, and advanced terminal behaviors not modeled by the Go API.
  - AutoCompletePromptTest::it_cycles_through_suggestions_with_arrow_keys
  - AutoCompletePromptTest::it_cycles_through_suggestions_wrapping_around
  - AutoCompletePromptTest::it_resets_highlighted_index_when_typing
  - AutoCompletePromptTest::it_tab_requests_suggestions_when_no_ghost_text_is_showing
  - AutoCompletePromptTest::it_can_fall_back
  - AutoCompletePromptTest::it_accepts_a_collection
  - ConfirmPromptTest::it_can_fall_back
  - DataTablePromptTest::it_renders_a_table_with_headers_and_search_line
  - DataTablePromptTest::it_returns_the_key_for_associative_arrays
  - DataTablePromptTest::it_returns_the_original_key_after_filtering_a_list_array
  - DataTablePromptTest::it_cancels_search_with_escape
  - DataTablePromptTest::it_shows_no_results_message_when_search_matches_nothing
  - DataTablePromptTest::it_renders_column_aware_borders
  - DataTablePromptTest::it_shows_simple_borders_when_no_results
  - DataTablePromptTest::it_shows_viewing_info_only_when_scrolling_is_needed
  - DataTablePromptTest::it_shows_viewing_info_when_there_are_more_rows_than_scroll
  - DataTablePromptTest::it_handles_multiline_cells
  - DataTablePromptTest::it_keeps_highlighted_multiline_row_fully_visible
  - DataTablePromptTest::it_uses_comfortable_width_and_does_not_stretch_to_terminal
  - DataTablePromptTest::it_handles_outlier_column_widths_gracefully
  - DataTablePromptTest::it_renders_cancel_state_with_strikethrough_data
  - DataTablePromptTest::it_renders_submit_state_with_selected_row
  - DataTablePromptTest::it_scrolls_and_shows_scrollbar_when_needed
