version: 1

adaptation_rules:
  database:
    source: Framework\Database
    rules:
      - upstream: Traits such as HasAttributes
        bedrock: Embedded structs
      - upstream: Magic __get and __set access
        bedrock: GetAttribute and SetAttribute methods
      - upstream: Static model methods such as User::find(1)
        bedrock: Instance builders such as userBuilder.Find(ctx, 1)
      - upstream: DB and Schema facades
        bedrock: Container resolution via app.Make("db")
      - upstream: Closures in transactions
        bedrock: Transaction(ctx, func(tx Connection) error)
      - upstream: PHP exceptions
        bedrock: Explicit error returns
      - upstream: SQL Server support
        bedrock: Not implemented; MySQL, MariaDB, PostgreSQL, and SQLite are the supported SQL dialects

  queue:
    source: Framework\Queue
    rules:
      - upstream: IoC container and App::make
        bedrock: HandlerRegistry keyed by name
      - upstream: Orm model serialization via SerializesModels
        bedrock: Out of scope; jobs carry plain structs or maps
      - upstream: Serializable closures
        bedrock: Registered handler names
      - upstream: PHP queue attributes such as Tries, Backoff, Timeout, and Queue
        bedrock: Go struct tags parsed by options.go
      - upstream: config('queue.*') helpers
        bedrock: Explicit config maps passed to Manager.SetConfig
      - upstream: Event::fake and Bus::fake
        bedrock: Package-local test helpers
      - upstream: Real service dependencies in unit tests
        bedrock: Fakes or build-tagged integration tests where an external service is required
      - upstream: PHPUnit exception expectations
        bedrock: errors.Is and errors.As

  bus:
    source: Framework\Bus
    rules:
      - upstream: PendingBatch accepts PHP iterables, collections, closures, and filters falsy values
        bedrock: PendingBatch accepts explicit Go job slices; callers filter nil or invalid jobs before dispatch when needed
      - upstream: Batchable trait validation rejects jobs without the trait at construction time
        bedrock: Batch membership is opt-in through small Go methods such as WithBatchID; non-batchable jobs may still be dispatched
      - upstream: allowFailures accepts booleans, closures, callable strings, arrays, and filters invalid runtime callables
        bedrock: AllowFailures, DisallowFailures, and OnFailure expose typed Go callbacks
      - upstream: Serializable closures and facade-driven chained closure dispatch
        bedrock: Chains and batches carry concrete Go jobs or registered handlers
      - upstream: Postgres batch options use PHP serialize and base64 compatibility
        bedrock: Batch repository options are stored as JSON consistently across supported SQL drivers
      - upstream: PendingDispatch dynamically proxies unknown methods to the wrapped job
        bedrock: Queueable exposes explicit typed fluent methods

  translation:
    source: Framework\Translation
    rules:
      - upstream: PHP arrays returned from .php language files
        bedrock: JSON files with equivalent key/value structure
      - upstream: Filesystem mocks via Mockery
        bedrock: Real files under t.TempDir
      - upstream: Countable interface
        bedrock: translation.Countable with Len() int
      - upstream: BackedEnum and UnitEnum
        bedrock: fmt.Stringer or Translator.Stringable registrations
      - upstream: MessageSelector::getPluralIndex integer parameter
        bedrock: float64 input to preserve float pluralization behaviour
      - upstream: config('app.locale') and config('app.fallback_locale')
        bedrock: NewTranslator(loader, locale, fallback)

  validation:
    source: Framework\Validation
    rules:
      - upstream: IoC container
        bedrock: Plain rule functions and validation interfaces
      - upstream: Orm exists and unique rules
        bedrock: PresenceVerifier interface with fakes in tests
      - upstream: PHP exceptions
        bedrock: ValidationException error value wrapping MessageBag
      - upstream: Closure-based rules
        bedrock: ValidationRule interface or RuleFunc
      - upstream: PHP enum validation
        bedrock: Not implemented; Go has no runtime enum equivalent
      - upstream: Password breach check
        bedrock: Not implemented by default because it requires an external HTTP call
      - upstream: ActiveUrl via checkdnsrr
        bedrock: net.LookupHost

  auth:
    source: Framework\Auth
    rules:
      - upstream: PHP callback forms, container-bound policy callbacks, and Macroable methods
        bedrock: Explicit Go functions, interfaces, and method registration
      - upstream: BackedEnum and UnitEnum ability or guard names
        bedrock: String ability and guard identifiers
      - upstream: Middleware definition strings and route parameter model binding
        bedrock: net/http middleware closures with explicit guard and model values
      - upstream: Orm model creation and query-handler registration
        bedrock: Injected provider interfaces and caller-owned ORM/query implementations
      - upstream: Redirect response status codes from password broker workflows
        bedrock: Explicit error returns from broker methods

  broadcasting:
    source: Framework\Broadcasting
    rules:
      - upstream: PHP channel callbacks and class-based join methods
        bedrock: Explicit ChannelHandler functions or ChannelJoiner implementations
      - upstream: PHP reflection and container route binding
        bedrock: Explicit named BindingFunc registrations
      - upstream: Request user lookup with optional guard names
        bedrock: AuthRequest with a UserResolver and ordered guard lookup
      - upstream: PHP exceptions for denied channel auth and backend failures
        bedrock: ErrAccessDenied and ErrBroadcast error values

  cache:
    source: Framework\Cache
    rules:
      - upstream: APC and Memcached concrete store tests
        bedrock: Not implemented; Bedrock cache backends are exposed through Store implementations for array, file, database, Redis, DynamoDB, session, null, failover, memoized, and tagged caches
      - upstream: CLI cache clear commands and real-time facade clearing
        bedrock: Out of scope until Bedrock ships an CLI-compatible console layer
      - upstream: PHP closures, invokable objects, callable strings, Macroable methods, and enums
        bedrock: Explicit Go functions, interfaces, and string identifiers
      - upstream: PHP serialization, incomplete class handling, and copy-on-write reference behavior
        bedrock: Native Go values, error returns, and normal Go reference semantics
      - upstream: Driver-specific SQL assertions for PostgreSQL and SQLite
        bedrock: DatabaseStore is tested through the injected DBConnection contract; dialect details live in the database package
      - upstream: Filesystem permission and lock-directory exception assertions
        bedrock: FileStore uses Go filesystem primitives and explicit lock directory configuration without Upstream's PHP-specific permission contract

  config:
    source: Framework\Config
    rules:
      - upstream: Macroable runtime method registration
        bedrock: Explicit Go methods and compile-time APIs

  concurrency:
    source: Framework\Concurrency
    rules:
      - upstream: Serializable closures dispatched to child PHP processes
        bedrock: Explicit Go Task functions executed by sync or goroutine drivers
      - upstream: Hidden CLI invoke-serialized-closure command
        bedrock: No console command is required; callers pass typed Go tasks directly
      - upstream: Process exit codes and serialized exception rehydration
        bedrock: Task failures are explicit error returns or recovered panics
      - upstream: Associative array input preserves string keys in output
        bedrock: Task slices return ordered results by task index

semantic_divergences:
  - surface: database
    divergence: No static methods
    rationale: Go does not support PHP-style static methods.
  - surface: database
    divergence: Explicit context.Context on I/O methods
    rationale: Go uses explicit request cancellation and deadline propagation.
  - surface: database
    divergence: Error returns instead of exceptions
    rationale: Go error values are the idiomatic failure channel.
  - surface: database
    divergence: No SQL Server dialect
    rationale: Bedrock currently targets MySQL, MariaDB, PostgreSQL, and SQLite.
  - surface: queue
    divergence: No default global transaction-aware dispatch
    rationale: Go has no global DB facade analogous to Upstream's DB::transaction.
  - surface: queue
    divergence: Worker memory limits are advisory
    rationale: Go's garbage collector makes PHP-style hard memory caps meaningless.
  - surface: queue
    divergence: Unique jobs use a CacheLock interface
    rationale: Avoids a hard dependency on a specific cache backend.
  - surface: bus
    divergence: Pending batches use explicit Go job slices
    rationale: Go has no PHP-style truthiness or collection/iterable runtime conversion.
  - surface: bus
    divergence: Batchable behavior is structural
    rationale: Go uses explicit method-based contracts instead of traits.
  - surface: bus
    divergence: Failure callbacks are typed
    rationale: Go has no safe equivalent for PHP runtime callable-string filtering.
  - surface: bus
    divergence: Batch options are JSON encoded
    rationale: Bedrock avoids PHP serialize and keeps repository payloads portable.
  - surface: translation
    divergence: Invalid locale returns ErrInvalidLocale
    rationale: Go returns errors instead of throwing InvalidArgumentException.
  - surface: translation
    divergence: Translator is constructed directly
    rationale: Bedrock avoids global container lookup for translation.
  - surface: translation
    divergence: Tag replacements use func(string) string
    rationale: PHP HtmlString-wrapping callables map to plain Go functions.
  - surface: validation
    divergence: PHP enum validation is not implemented
    rationale: Go has named constants but no PHP-style runtime enum type.
  - surface: validation
    divergence: Password uncompromised breach check is not wired by default
    rationale: The check requires external HTTP and should be caller-controlled.
  - surface: broadcasting
    divergence: Channel parameter binding is explicit
    rationale: Go does not have PHP's runtime reflection, container resolution, or Orm route binding model.
  - surface: broadcasting
    divergence: Provider SDKs are injected through small interfaces
    rationale: Unit tests should not require live Pusher, Redis, or Ably services.
  - surface: cache
    divergence: APC and Memcached stores are not shipped
    rationale: Bedrock exposes cache behavior through portable Go store contracts and currently ships other concrete stores.
  - surface: cache
    divergence: Cache console commands are not shipped
    rationale: Bedrock does not currently include Upstream's CLI-compatible console surface.
  - surface: cache
    divergence: Dynamic PHP runtime APIs are explicit Go APIs
    rationale: Go uses typed functions, interfaces, and string identifiers instead of PHP closure binding, callable strings, Macroable methods, and enums.
  - surface: cache
    divergence: Cache payloads use Go value semantics
    rationale: Go has different reference and serialization behavior than PHP's copy-on-write object model.
  - surface: concurrency
    divergence: No serialized closure process transport
    rationale: Go closures are not serialized across process boundaries; Bedrock runs explicit Task functions with sync or goroutine drivers.
  - surface: concurrency
    divergence: Error returns instead of serialized PHP exceptions
    rationale: Go preserves failure identity through error values, errors.Is, errors.As, and recovered panics.
  - surface: concurrency
    divergence: Ordered slice results instead of associative array keys
    rationale: Bedrock Task input is a typed slice, so result order is preserved by index rather than PHP string keys.
  - surface: config
    divergence: No runtime macro registration
    rationale: Go does not support PHP-style dynamic method registration; Bedrock exposes explicit methods instead.

