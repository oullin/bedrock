version: 1

features:
  - id: framework.auth.guards
    source_id: framework.auth
    name: Authentication guards
    upstream: Framework\Auth guard and provider system
    bedrock: auth
    status: ported
    docs: packages/auth.md
    notes: Session, token, request, basic-auth, provider, and event surfaces are complete under classified parity; PHP runtime mechanics are covered by Go adaptation rules in divergences.yml.

  - id: framework.auth.passwords
    source_id: framework.auth
    name: Password broker
    upstream: Framework\Auth password reset broker
    bedrock: auth
    status: ported
    docs: packages/auth.md
    notes: Password reset tokens, throttling, callback notification override, notification sender hook, and reset-link events are complete under classified parity; PHP manager/config mechanics are covered by Go adaptation rules in divergences.yml.

  - id: framework.broadcasting.contracts
    source_id: framework.broadcasting
    name: Broadcasting contracts
    upstream: Framework\Broadcasting channel and event contracts
    bedrock: broadcasting
    status: ported
    docs: packages/broadcasting.md
    notes: Server-side channel auth, broadcast event payload handling, Pusher/Redis/Ably broadcaster responses, and Pusher channel conventions are ported; BroadcastClient remains the client receiver package.

  - id: framework.bus.dispatch
    source_id: framework.bus
    name: Command bus dispatch
    upstream: Framework\Bus command dispatch, chains, and middleware
    bedrock: bus
    status: ported
    docs: packages/bus.md
    notes: Command dispatch, queue routing, after-response dispatch, chains, batches, lifecycle events, and typed failure callbacks are complete under classified parity; PHP runtime mechanics are covered by Go adaptation rules in divergences.yml.

  - id: framework.cache.repository
    source_id: framework.cache
    name: Cache repository
    upstream: Framework\Cache stores, repositories, tags, and locks
    bedrock: cache
    status: partial
    docs: packages/cache.md
    notes: Cache abstractions are present, but upstream test parity is still missing.

  - id: framework.concurrency.tasks
    source_id: framework.concurrency
    name: Concurrent task execution
    upstream: Framework\Concurrency task drivers
    bedrock: concurrency
    status: ported
    docs: packages/concurrency.md
    notes: Executable Go equivalents cover distributed task execution, error propagation, typed error inspection, and result ordering; PHP process and serialized-closure mechanics are adapted to explicit Go tasks, goroutines, error returns, and panic recovery.

  - id: framework.conditionable.proxy
    source_id: framework.conditionable
    name: Conditional fluent execution
    upstream: Framework\Conditionable when and unless helpers
    bedrock: conditionable
    status: ported
    docs: packages/conditionable.md
    notes: Executable Go equivalents cover when and unless; PHP dynamic no-argument and magic behavior is represented through explicit Go proxy constructors.

  - id: framework.config.repository
    source_id: framework.config
    name: Configuration repository
    upstream: Framework\Config repository
    bedrock: config
    status: ported
    docs: packages/config.md
    notes: Dot-notation reads, literal-dot key precedence, explicit nil values, write helpers, typed getters, collection wrapping, and explicit Go offset adaptations are complete under classified parity; PHP Macroable runtime mechanics are covered by Go adaptation rules in divergences.yml.

  - id: framework.console.commands
    source_id: framework.console
    name: Console commands
    upstream: Framework\Console command runtime
    bedrock: console
    status: ported
    docs: packages/console.md
    notes: Command registration and dispatch, signature parsing, typed input and output helpers, signal traps, scheduling primitives, and explicit command/scheduling mutexes are complete under classified parity; Symfony/PHP attribute runtime and dynamic Macroable/callable-string mechanics are covered by Go adaptation rules in divergences.yml.

  - id: framework.container.bindings
    source_id: framework.container
    name: Container bindings
    upstream: Framework\Container bindings, singletons, tags, and contextual resolution
    bedrock: container
    status: ported
    docs: packages/container.md
    notes: Bindings, shared and scoped lifecycles, aliases, contextual bindings, tags, extenders, method bindings, and resolving callbacks are complete under classified parity; PHP reflection, attributes, callable strings, ArrayAccess, and environment selectors are covered by Go adaptation rules in divergences.yml.

  - id: framework.contracts.interfaces
    source_id: framework.contracts
    name: Shared interfaces
    upstream: Framework\Contracts interfaces
    bedrock: contracts
    status: ported
    docs: packages/contracts.md
    notes: Interface compliance is tracked through concrete package inventories.

  - id: framework.cookie.queueing
    source_id: framework.cookie
    name: Cookie handling
    upstream: Framework\Cookie queueing and cookie values
    bedrock: cookie
    status: ported
    docs: packages/cookie.md
    notes: Cookie creation, queueing, response attachment, and encrypted-cookie middleware are complete under classified parity; PHP mixed arguments and Macroable runtime mechanics are covered by Go adaptation rules in divergences.yml.

  - id: framework.database.query
    source_id: framework.database
