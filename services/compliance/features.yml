    status: ported
    docs: packages/database.md
    notes: Model, attribute, timestamp, scope, soft-delete, visibility, collection, and builder primitives are complete under classified parity; PHP trait, magic property, relation, and recursive runtime mechanics are covered by Go adaptation rules in divergences.yml.

