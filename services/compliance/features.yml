    upstream: Framework\Database query builder and SQL grammars
    bedrock: database
    status: ported
    docs: packages/database.md
    notes: Query builders, SQL grammars, connection management, transactions, schema, migrations, and seeding are complete under classified parity; PHP facades, static model calls, exceptions, and unsupported SQL Server behavior are covered by Go adaptation rules in divergences.yml.

  - id: framework.database.orm
    source_id: framework.database
    name: Orm-style ORM
    upstream: Framework\Database\Orm models and relations
