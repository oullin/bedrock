    name: Encrypter
    upstream: Framework\Encryption encrypter payloads and ciphers
    bedrock: encryption
    status: ported
    docs: packages/encryption.md
    notes: CBC and GCM encryption, previous-key decryption, MAC/tag validation, key parsing, cipher validation, tamper rejection, and encrypted-value detection are complete under classified parity; PHP serialization and mixed runtime input checks are covered by Go adaptation rules in divergences.yml.

