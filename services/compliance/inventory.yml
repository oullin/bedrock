version: 1
baseline:
  name: Laravel 13.x
  primary_repo: laravel/framework
  primary_branch: 13.x

rules:
  statuses:
    - included
    - mapped
    - excluded-permanent
    - excluded-temporary
    - missing
  source_of_truth: services/compliance
  package_local_parity_docs_allowed: false
  package_local_inventory_files_allowed: false
  upstream_feature_audits:
    required_for_mapped_bedrock_surfaces: true
    prompt: "make sure we also have all the upstream features for <package>"
    evidence:
      - Compare the upstream source contracts, public APIs, middleware, events, and runtime behavior against the Bedrock package surface.
      - Add executable parity tests for Bedrock-equivalent features.
      - Record PHP-only or intentionally different behavior in services/compliance/divergences.yml.
      - Keep services/compliance/features.yml updated so every mapped Bedrock surface has feature audit coverage.

