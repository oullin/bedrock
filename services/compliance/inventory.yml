excluded_permanent:
  - id: package.sanctum
    laravel: laravel/sanctum
    status: excluded-permanent
    rationale: Product boundary; Sanctum is intentionally not part of Bedrock.

  - id: package.octane
    laravel: laravel/octane
    status: excluded-permanent
    rationale: Product boundary; PHP worker/runtime management does not map to Bedrock.

  - id: package.pulse
    laravel: laravel/pulse
    status: excluded-permanent
    rationale: Product boundary; application monitoring dashboard is intentionally excluded.

  - id: package.folio
    laravel: laravel/folio
    status: excluded-permanent
    rationale: Product boundary; page-based PHP routing is intentionally excluded.

  - id: package.dusk
    laravel: laravel/dusk
    status: excluded-permanent
    rationale: Product boundary; browser automation package is excluded. Any future browser work must use Agent Browser.

  - id: package.browser_kit_testing
    laravel: laravel/browser-kit-testing
    status: excluded-permanent
    aliases:
      - browser-kit
      - broswer-kit
    rationale: Product boundary; legacy BrowserKit compatibility is intentionally excluded.

  - id: package.sail
    laravel: laravel/sail
    status: excluded-permanent
    rationale: Product boundary; Docker development environment tooling is intentionally excluded.

  - id: package.installer
    laravel: laravel/installer
    status: excluded-permanent
    aliases:
      - intaller
    rationale: Product boundary; Laravel application installer tooling is intentionally excluded.

  - id: package.valet
    laravel: laravel/valet
    status: excluded-permanent
    rationale: Product boundary; macOS local development service management is intentionally excluded.

  - id: package.vite_plugin
    laravel: laravel/vite-plugin
    status: excluded-permanent
    rationale: Product boundary; Vite integration tooling is intentionally excluded.

  - id: package.starter_kits
    laravel: starter-kits
    status: excluded-permanent
    aliases:
      - stater-kits
    rationale: Product boundary; application starter kits are intentionally excluded.

  - id: package.workos
    laravel: laravel/workos
    status: excluded-permanent
    rationale: Product boundary; WorkOS starter-kit integration is intentionally excluded.
