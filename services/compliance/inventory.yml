excluded_permanent:
  - id: package.tokens
    upstream: upstream/tokens
    status: excluded-permanent
    rationale: Product boundary; Tokens is intentionally not part of Bedrock.

  - id: package.jobqueue
    upstream: upstream/jobqueue
    status: excluded-permanent
    rationale: Product boundary; queue monitoring UI/runtime is intentionally excluded.

  - id: package.octane
    upstream: upstream/octane
    status: excluded-permanent
    rationale: Product boundary; PHP worker/runtime management does not map to Bedrock.

  - id: package.pulse
    upstream: upstream/pulse
    status: excluded-permanent
    rationale: Product boundary; application monitoring dashboard is intentionally excluded.

  - id: package.logtail
    upstream: upstream/logtail
    status: excluded-permanent
    rationale: Product boundary; log-tail CLI is intentionally excluded.

  - id: package.folio
    upstream: upstream/folio
    status: excluded-permanent
    rationale: Product boundary; page-based PHP routing is intentionally excluded.

  - id: package.dusk
    upstream: upstream/dusk
    status: excluded-permanent
    rationale: Product boundary; browser automation package is excluded. Any future browser work must use Agent Browser.

  - id: package.browser_kit_testing
    upstream: upstream/browser-kit-testing
    status: excluded-permanent
    aliases:
      - browser-kit
      - broswer-kit
    rationale: Product boundary; legacy BrowserKit compatibility is intentionally excluded.

  - id: package.sail
    upstream: upstream/sail
    status: excluded-permanent
    rationale: Product boundary; Docker development environment tooling is intentionally excluded.

  - id: package.installer
    upstream: upstream/installer
    status: excluded-permanent
    aliases:
      - intaller
    rationale: Product boundary; Upstream application installer tooling is intentionally excluded.

  - id: package.valet
    upstream: upstream/valet
    status: excluded-permanent
    rationale: Product boundary; macOS local development service management is intentionally excluded.

  - id: package.remotetasks
    upstream: upstream/remotetasks
    status: excluded-permanent
    rationale: Product boundary; SSH task runner is intentionally excluded.

  - id: package.vite_plugin
    upstream: upstream/vite-plugin
    status: excluded-permanent
    rationale: Product boundary; Vite integration tooling is intentionally excluded.

  - id: package.starter_kits
    upstream: starter-kits
    status: excluded-permanent
    aliases:
      - stater-kits
    rationale: Product boundary; application starter kits are intentionally excluded.

  - id: package.workos
    upstream: upstream/workos
    status: excluded-permanent
    rationale: Product boundary; WorkOS starter-kit integration is intentionally excluded.
